aid: modulr
url: https://raw.githubusercontent.com/api-evangelist/modulr/refs/heads/main/apis.yml
name: Modulr
kind: company
description: >-
  Modulr is a United Kingdom-based embedded payments and Banking-as-a-Service
  platform that lets businesses and software platforms open programmable eMoney
  accounts and move money automatically via a single API. As a licensed
  e-money institution and direct participant in the UK Faster Payments and Bacs
  schemes (with SEPA reach in the EU through its Dutch entity), Modulr provides
  the underlying accounts, payment rails, card issuing, and Open Banking
  connectivity that fintechs, payroll providers, lenders, marketplaces, and
  travel and accounting platforms embed into their own products. Its REST API
  covers account creation, inbound and outbound payments (including bulk,
  batch, future-dated and SWIFT international), virtual and physical card
  issuing, Bacs Direct Debit collection, KYC/KYB customer onboarding,
  Confirmation of Payee and Verification of Payee, Payment Initiation Services
  and Variable Recurring Payments under Open Banking, plus a rich webhook
  notification layer. Modulr is API-native: it publishes a genuine public
  developer portal on ReadMe with reference docs and a downloadable OpenAPI 3.1
  definition, and offers a self-serve sandbox.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
