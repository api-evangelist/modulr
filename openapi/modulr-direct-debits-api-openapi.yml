    directdebit.CreateCollectionScheduleRequest:
      type: object
      description: Details of collection to create.
      properties:
        frequency:
          type: string
          description: 'Frequency for direct-debit collection. Can be one of: ONCE, WEEKLY, EVERY_TWO_WEEKS, EVERY_FOUR_WEEKS, MONTHLY, QUARTERLY, SEMI_ANNUALLY, ANNUALLY.'
          enum:
          - ONCE
          - MONTHLY
          - QUARTERLY
          - SEMI_ANNUALLY
          - ANNUALLY
          - WEEKLY
          - EVERY_TWO_WEEKS
          - EVERY_FOUR_WEEKS
          minLength: 1
        numberOfPayments:
          type: integer
          format: int32
          description: Number of payments for direct-debit collection, must be '1' where frequency is 'ONCE'.
          minimum: 1
        firstPaymentAmount:
          type: number
          description: 'Amount of the first collection payment.<br>

            Note: your item limit is set during onboarding will be lower than field maximum and Bacs scheme item limit of £20m.'
          example: '100.00'
          maximum: 20000000
          minimum: 0.01
        firstPaymentDate:
          type: string
          description: 'Date of the first collection payment, format must be: yyyy-MM-dd'
          example: '2018-01-10'
        regularPaymentAmount:
          type: number
          description: 'Amount of the regular collection payments following first collection amount. Does not apply where the frequency is ''ONCE''.<br>

            Note: your item limit is set during onboarding will be lower than field maximum and Bacs scheme item limit of £20m'
          example: '100.00'
          maximum: 20000000
          minimum: 0.01
        regularPaymentStartDate:
          type: string
          description: 'Start date of the regular collection payment, format: yyyy-MM-dd<br> Note: Does not apply where the frequency is ''ONCE''.'
          example: '2018-01-10'
        currency:
          type: string
          description: Currency in which payment should be made. Must be 'GBP' currently.
          minLength: 1
        externalReference:
          type: string
          description: External Reference for collection schedule, should contain only alphanumeric characters, underscore, hyphen and space.<br> For your internal reconciliation only, not sent to Bacs scheme.
          example: REFERENCE - 12
          maxLength: 50
          minLength: 0
          pattern: '[\w-\s]*'
        collectionReference:
          type: string
          description: 'An optional additional collection specific reference to be appended to the reference of the mandate.<br>

            This is concatenated after the  core reference of the mandate, and will be truncated if combined reference is >18 characters.<br>

            Should only contain alphanumeric characters, dot, ampersand, forward-slash and hyphen only.'
          example: ABCD - EFGH
          maxLength: 12
          minLength: 0
          pattern: '[\w-\s]*'
        collectionCorrelationName:
          type: string
          description: '(If enabled by Modulr) an optional collection specific reference appended to abbreviated SU name for the given collection schedule. If feature not enabled, any parameter supplied will be ignored.<br>

            When is enabled, this value is concatenated to a Service User Name abbreviation (set by Modulr) to form a Service User name containing extra information that can be used by payer to correlate (identify) transaction easily.<br>

            Characters restricted to: alphanumeric characters, numbers, space, dot, ampersand, forward-slash and hyphen only.'
          example: TEST/NAME-1.2
          maxLength: 18
          minLength: 0
          pattern: ^[a-zA-Z 0-9\.\&\/-]+$
      required:
      - currency
      - frequency
      - numberOfPayments
