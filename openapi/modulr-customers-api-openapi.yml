          maxLength: 40
          minLength: 0
        registeredAddress:
          $ref: '#/components/schemas/onboarding.AddressRequest'
          description: Mandatory for 'LLC', 'LLP' and 'LPARTNRSHP'
        tradingAddress:
          $ref: '#/components/schemas/onboarding.AddressRequest'
          description: Mandatory for all types except 'INDIVIDUAL' and 'PCM_INDIVIDUAL'
        industryCode:
          type: string
          description: Mandatory for all types except 'INDIVIDUAL', 'PCM_INDIVIDUAL' and 'PCM_BUSINESS'. In-house KYC partners -> Refer to Modulr Industry Code list. Outsourced KYC partners -> custom codes allowed.
          maxLength: 6
          minLength: 0
        tcsVersion:
          type: integer
          format: int32
          description: Terms and conditions version. Mandatory for all types except 'PCM_INDIVIDUAL' and 'PCM_BUSINESS'
          maximum: 1000
          minimum: 1
        type:
          type: string
          description: 'Type of the customer, can be one of:

            1. LLC -> limited company

            2. PLC -> publicly listed company

            3. SOLETRADER -> sole trader

            4. OPARTNRSHP -> ordinary partnership

            5. LPARTNRSHP -> limited partnership

            6. LLP -> limited liability partnership

            7. CHARITY -> charity

            8. INDIVIDUAL -> individual consumer

            9. PCM_INDIVIDUAL -> partner clearing model individual consumer

            10. PCM_BUSINESS -> partner clearing model business consumer

            11. TRUST -> trust customer

            12. PREQUALIFIED -> only for use by customers who have been pre-authorised by Modulr'
          minLength: 1
        expectedMonthlySpend:
          type: integer
          format: int32
          description: Mandatory for all types except 'PCM_INDIVIDUAL' and 'PCM_BUSINESS'
          maximum: 2147483647
          minimum: 0
        associates:
          type: array
          description: Mandatory for all types except 'PCM_BUSINESS'
