      required:
      - createdDate
      - cvv2
      - externalRef
      - frequencyUsage
      - id
      - maxLimit
      - pan
    card.AuthorisationConstraints:
      type: object
      description: Authorisation constraints
      properties:
        spend:
          type: array
          description: Spending constraints
          items:
            $ref: '#/components/schemas/card.SpendConstraintDetail'
    card.UpdateCardRequest:
      type: object
      description: Update card
      properties:
        limit:
          type: number
          description: Total card authorisation limit.
          example: '1000.00'
        cancellationDate:
          type: string
          description: ISO 8601 date with year, month & day components only. The supplied value must be in the future and at most 1 day before the expiry date.
          example: '2025-01-01'
        customFields:
          type: array
          description: Custom fields
          items:
            $ref: '#/components/schemas/card.CardCustomFieldRequest'
          maxItems: 20
          minItems: 1
        holder:
          $ref: '#/components/schemas/card.UpdateCardHolder'
          description: CardHolder
        authWindow:
          $ref: '#/components/schemas/card.AuthorisationWindowRequest'
          description: Authorisation Windows allow the card holder to add a period of time where the card can ONLY be used, if an Authorisation Window set then transactions outside this window will decline. ISO 8601 date with year, month & day components only.
    card.CardTokenDevice:
      type: object
      properties:
        id:
          type: string
          description: Device ID
          example: D110000001
        type:
          type: string
          description: Device type
          enum:
          - CLOTHING
          - MEDIA_GAMING
          - CARD
          - DOMESTIC_APPLIANCE
          - FOB
          - MOBILE_TAG
          - FASHION
          - JEWELRY
          - MOBILE_PHONE
          - PERSONAL_COMPUTER
          - WRISTBAND
          - STICKER
          - TABLET
          - UNKNOWN
          - VEHICLE
          - WATCH
          - MOBILE_PHONE_OR_TABLET
          example: MOBILE_PHONE
        ip:
          type: string
          description: IPv4 address of the device. Either in hex format (i.e FFFFFFFF) or decimal format (i.e. 255.255.255.255)
          example: 255.255.255.255
        name:
          type: string
          description: Device name, as given by the cardholder
          example: iPhone 12
        status:
          type: string
          description: Device status
          enum:
          - PENDING_PROVISIONING
          - PROVISIONED
          - DELETED
          - UNKNOWN
          example: ACTIVE
        externalId:
          type: string
          description: Device External Id
      required:
      - externalId
      - id
      - ip
      - name
      - status
      - type
    card.CardActivityPageResponse:
      type: object
      properties:
        content:
          type: array
          description: List of responses on the current page
          items:
            $ref: '#/components/schemas/card.CardActivityResponse'
        size:
          type: integer
          format: int32
          description: Page size
        totalSize:
          type: integer
          format: int64
          description: Total count
        page:
          type: integer
          format: int32
          description: Current page number, 0 based; i.e first-page = 0, second-page = 1
        totalPages:
          type: integer
          format: int32
          description: Total pages
      required:
      - content
      - page
      - size
      - totalPages
      - totalSize
    card.AsyncTaskCreatedResponse:
      type: object
      properties:
        taskUrl:
          type: string
          description: Url of card task resource
        taskId:
          type: string
          description: ID of card task
        metaData:
          type: object
          additionalProperties:
            type: string
          description: Meta data associated with async task response
      required:
      - taskId
      - taskUrl
    card.AppleInAppProvisioningRequest:
      type: object
      description: Apple in app provisioning request
      properties:
        leafCertificate:
          type: string
          description: Apple issued public base 64 encoded certificate to encrypt the provisioning data
          minLength: 1
        additionalCertificates:
          type: array
          description: Apple issued public base 64 encoded certificates that complete the chain including the root certificate
          items:
            type: string
        nonce:
          type: string
          description: Hex encoded nonce generated by the client
          minLength: 1
        nonceSignature:
          type: string
          description: Hex encoded nonce signed with the private key to verify the certificate public key
          minLength: 1
      required:
      - additionalCertificates
      - leafCertificate
      - nonce
      - nonceSignature
    card.Replace:
      allOf:
      - $ref: '#/components/schemas/card.PatchOperation'
      - type: object
        properties:
          value:
            $ref: '#/components/schemas/card.JsonNode'
      description: Replace field
      required:
      - op
      - path
      - value
    card.OneTimeTokenRequest:
      type: object
      properties:
        publicKey:
          type: string
          description: Base64 UTF-8 encoded RSA public key to be used to encrypt the token in the response. The key must be at least 4096 bits in length.
        purpose:
          type: string
          default: READ
          description: What the token will be used for. UPDATE tokens cannot be used for READ purposes, and READ tokens cannot be used for updates.
          enum:
          - READ
          - UPDATE
    card.Move:
      allOf:
      - $ref: '#/components/schemas/card.PatchOperation'
      - type: object
        properties:
          from:
            type: string
            example: /path/to/originating/field
      description: Move field
      required:
      - from
      - op
      - path
    card.UpdateCardAuthenticationRequest:
      type: object
      description: Authentication
      properties:
        knowledgeBase:
          type: array
          description: 3DS Knowledge-Based Authentication (KBA) answers
          items:
            $ref: '#/components/schemas/card.CardKnowledgeBasedAuthentication'
      required:
      - knowledgeBase
    card.Constraints:
      type: object
      properties:
        authorisation:
          $ref: '#/components/schemas/card.AuthorisationConstraints'
          description: Authorisation constraints
    card.ReportResponse:
      type: object
      properties:
        id:
          type: string
        reportSubjectId:
          type: string
        reportDate:
          type: string
          format: date
        reportType:
          type: string
          enum:
          - DAILY_CARD_ACTIVITY
          - MONTHLY_CARD_ACTIVITY
          - DAILY_ACCOUNT_FUNDING
          - MONTHLY_ACCOUNT_FUNDING
          - DAILY_AUTH_WINDOW
          - DAILY_CARD_MANAGEMENT
    card.AuthInfo:
      type: object
      properties:
        type:
          type: string
          description: Transaction type
          minLength: 1
        inputMethod:
          type: string
          description: Input method
          minLength: 1
      required:
      - inputMethod
      - type
    card.CustomFields:
      type: object
      properties:
        key:
          type: string
          description: Custom field key
        required:
          type: boolean
          description: Whether the custom field is required or not
      required:
      - key
      - required
    card.UpdateCardReportNotificationRequest:
      type: object
      description: Notification request containing the status of the notification
      properties:
        status:
          type: string
          description: status
          minLength: 1
      required:
      - status
    card.GetCardTokensResponse:
      type: object
      properties:
        size:
          type: integer
          format: int32
          description: Number of elements in content
          example: 1
        content:
          type: array
          description: List of response elements
          items:
            $ref: '#/components/schemas/card.CardToken'
      required:
      - content
      - size
  securitySchemes:
    modulo_security:
      type: apiKey
      name: Authorization
      in: header
    TOKEN:
      type: apiKey
      name: Authorization
      in: header
x-readme:
  proxy-enabled: false
