source: mcp/modulr-mcp.yml + openapi/modulr-api.json
notes: >-
  Modulr's MCP is a ReadMe reference-search server, not a bespoke per-operation
  business-tool server. Its six tools are generic meta-tools over the OpenAPI
  reference and docs (list/search/get endpoints, doc search/fetch) plus a single
  generic HAR pass-through (execute-request) that can invoke ANY of the 207 REST
  operations. There is therefore no 1:1 tool-to-operationId binding; the tools are
  MCP-only meta-capabilities and the entire REST surface is reachable only through
  execute-request.
surfaces:
  openapi:
    file: openapi/modulr-api.json
    operations: 207
  graphql: none
  mcp:
    url: https://modulr.readme.io/mcp
    tools_list: open (200, anonymous)
    execute: sandbox only, requires caller-supplied HMAC/token credentials
crosswalk: []
mcp_only:
- tool: list-endpoints
  reason: Meta-tool that enumerates the OpenAPI paths/methods; not backed by a single business operation.
- tool: get-endpoint
  reason: Meta-tool returning reference detail for one path+method; introspects the spec, does not call it.
- tool: search-endpoints
  reason: Meta-tool searching the OpenAPI for matching operations; discovery, not execution.
- tool: execute-request
  reason: >-
    Generic HAR pass-through. Binds to no single operationId; can execute any of
    the 207 REST operations against the sandbox with caller credentials.
- tool: search
  reason: Documentation search across guides/reference; no REST backing.
- tool: fetch
  reason: Documentation content retrieval by ID; no REST backing.
rest_only:
  note: >-
    All 207 REST operations are rest_only in the sense that none has a dedicated
    named MCP tool; they are invokable only via the generic execute-request tool.
