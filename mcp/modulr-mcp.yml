method: searched
status: published
source: https://modulr.readme.io/docs/build-with-ai-mcp
notes: 'Official Modulr MCP server (early access), hosted by Modulr''s ReadMe developer portal. It is
  a documentation/reference-search MCP: the tools search and reason over Modulr''s published OpenAPI reference
  and guides, and can execute sandbox API calls with credentials configured in the caller''s own AI tool.
  Anonymous tools/list succeeds (200); no credentials are needed to discover the reference.'
server:
  name: modulr
  transport: http
  url: https://modulr.readme.io/mcp
  auth: none (discovery); sandbox calls use the caller's own Modulr HMAC/token credentials
  install:
    claude_code: claude mcp add --transport http modulr https://modulr.readme.io/mcp
    cursor: '{"mcpServers":{"modulr":{"url":"https://modulr.readme.io/mcp"}}}'
    vscode: '{"servers":{"modulr":{"type":"http","url":"https://modulr.readme.io/mcp"}}}'
tools:
- name: list-endpoints
  description: Lists all API paths and their HTTP methods with summaries, organized by path. Results can
    be passed directly into 'get-endpoint'.
  read_only: true
- name: get-endpoint
  description: Gets detailed information about a specific API endpoint, including security schemes and
    servers
  read_only: true
  inputs:
  - path
  - method
- name: search-endpoints
  description: Performs a deep search through paths, operations, and parameters to discover relevant API
    endpoints. Use this tool to find specific API capabilities, required parameters, or data models based
    on search keywords. Results can be passed directly into 'get-endpoint'.
  read_only: true
  inputs:
  - pattern
- name: direct-debit-collections-guide
  description: Returns the Direct Debit (DD) collections guide — call this when a developer asks about
    setting up mandates, scheduling recurring collections or repayments, checking collection or mandate
    status, understanding the Bacs processing cycle, handling failed payments, retrying via representment,
    or recovering payments via Pay by Bank (PIS)
- name: failed-payment-recovery-guide
  description: Returns the failed payment recovery guide — call this when a developer asks about handling
    failed Direct Debit collections, ARUDD return reasons, retrying payments, representment, switching
    from Direct Debit to Pay by Bank, dunning flows, or recovering missed payments.
- name: pay-by-bank-pis-guide
  description: Returns the Pay by Bank (PIS / Open Banking) guide — call this when a developer asks about
    one-off payments via Open Banking, payment initiation, ASPSP bank selection, customer consent redirects,
    Faster Payments settlement, or using PIS as a fallback for failed Direct Debits
