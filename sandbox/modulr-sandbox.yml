test_tooling:
- name: Mock inbound payment (credit an account)
  operationId: createPayments
  path: POST /payments (sandbox only)
  description: >-
    Sandbox-only endpoint to simulate/mock the credit (inbound payment) of an
    account so downstream flows can be tested without a real bank credit.
  docs: https://modulr.readme.io/reference/createpayments
- name: Card Simulator
  description: >-
    Sandbox card-simulator operations (authorisations, settlements, reversals,
    chargebacks) under the "Card Simulator" OpenAPI tag let you drive card lifecycle
    and decline scenarios without a physical terminal.
notes: >-
  Modulr publishes no fixed magic test card numbers or test bank accounts in the
  public docs; sandbox test data is provisioned per sandbox account. No values are
